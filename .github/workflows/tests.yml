name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The RHP cache is 125 MB and no test reads it.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile every module
        run: python -m compileall -q ipo_radar generate_briefing.py generate_tactical_memo.py

      # The suite itself adds no test-only dependencies - it runs under plain
      # python with no pytest - but it does import the engine, and the engine
      # needs its runtime deps (httpx reaches it transitively via util.py).
      - name: Winner's Curse regression
        run: python tests/test_winners_curse.py

      # pydantic and weasyprint are deliberately NOT in requirements.txt:
      # PEP 668 makes them uninstallable on a Homebrew Python, so the engine
      # degrades to stdlib validation and a fallback PDF renderer instead of
      # hard-requiring them. This proves that path still works.
      - name: Import with the optional extras absent
        run: |
          python - <<'EOF'
          import ipo_radar.config, ipo_radar.models, ipo_radar.util
          from ipo_radar.analytics.portfolio import PortfolioOptimizer
          from ipo_radar.analytics.tday_signals import TDaySignalEngine
          from ipo_radar.config import PortfolioConfig
          floors = {PortfolioOptimizer(1.0).min_score,
                    TDaySignalEngine.MIN_SCORE,
                    PortfolioConfig().min_score}
          assert len(floors) == 1, f"execution floor has drifted: {floors}"
          print("execution floor consistent:", floors.pop())
          EOF
